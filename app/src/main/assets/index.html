<title>BJT Niwa</title>
<script>
/* Bản app Android: nối nút loa với bộ đọc văn bản (TTS) của Android */
(function(){
  if(!window.AndroidTTS) return;
  var waiting = {}, n = 0;
  window.__ttsDone = function(id){ var u = waiting[id]; delete waiting[id]; if(u && u.onend){ try{ u.onend(); }catch(e){} } };
  function Utterance(text){ this.text = text; this.lang = 'ja-JP'; this.rate = 1; this.voice = null; this.onend = null; this.onerror = null; }
  var synth = {
    getVoices: function(){ return [{lang:'ja-JP', name:'Android ja'}, {lang:'en-GB', name:'Android en'}]; },
    cancel: function(){ try{ AndroidTTS.stop(); }catch(e){} },
    speak: function(u){
      var id = 'u' + (++n); waiting[id] = u;
      var lang = String(u.lang || (u.voice && u.voice.lang) || 'ja-JP');
      var ok = false; try{ ok = AndroidTTS.speak(String(u.text), lang, Number(u.rate) || 1, id); }catch(e){}
      if(!ok){ delete waiting[id]; if(u.onerror) try{ u.onerror(); }catch(e){}
        if(typeof window.toast === 'function') window.toast(/^en/i.test(lang)
          ? 'Máy chưa có giọng đọc tiếng Anh. Vào Cài đặt > Chuyển văn bản thành giọng nói để tải thêm.'
          : 'Máy chưa có giọng đọc tiếng Nhật. Vào Cài đặt > Chuyển văn bản thành giọng nói để tải thêm.'); }
    }
  };
  window.SpeechSynthesisUtterance = Utterance;
  try{ Object.defineProperty(window, 'speechSynthesis', {configurable:true, value:synth}); }catch(e){ window.speechSynthesis = synth; }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F7FE; --card:#FFFFFF; --ink:#13274A; --muted:#5A6E90; --line:#D8E4F5;
  --indigo:#2D6BD8; --indigo-soft:#E3EDFC; --matcha:#1594D6; --matcha-soft:#DFF2FC;
  --shu:#D2453D; --shu-soft:#FBE6E4; --pot:#2C4A78; --pot-rim:#3B5D91; --soil:#5B4636;
  --shadow:0 1px 0 rgba(30,70,140,.06), 0 10px 28px -14px rgba(30,70,140,.28);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1930; --card:#14243F; --ink:#E3ECFB; --muted:#93A8CB; --line:#243A5E;
    --indigo:#6CA2F7; --indigo-soft:#1C3459; --matcha:#4EBDF0; --matcha-soft:#133349;
    --shu:#F08479; --shu-soft:#3A2228; --pot:#3B5D91; --pot-rim:#4E72AA; --soil:#4A392C;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1930; --card:#14243F; --ink:#E3ECFB; --muted:#93A8CB; --line:#243A5E;
    --indigo:#6CA2F7; --indigo-soft:#1C3459; --matcha:#4EBDF0; --matcha-soft:#133349;
    --shu:#F08479; --shu-soft:#3A2228; --pot:#3B5D91; --pot-rim:#4E72AA; --soil:#4A392C;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.65);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.jp{font-family:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-box{width:100%;max-width:380px}
.login-mark{display:flex;align-items:flex-end;gap:14px;margin-bottom:28px}
.login-mark .big{font-size:88px;line-height:.9;color:var(--indigo);background:linear-gradient(120deg,#2563EB 25%,#7DD3FC 45%,#2563EB 65%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:bigShimmer 5s ease-in-out infinite,logoFloat 5s ease-in-out infinite}
@keyframes bigShimmer{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.login-mark h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.login-mark p{margin:2px 0 0;color:var(--muted);font-size:14px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:18px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--indigo);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0D1930}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0D1930}}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:14px;font-weight:500;margin-bottom:5px}
.field small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.input{width:100%;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;outline:none}
.input:focus{border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-soft)}
textarea.input{min-height:72px;resize:vertical}
.err{color:var(--shu);font-size:14px;min-height:22px;margin:4px 0 8px}
.note{color:var(--muted);font-size:13px;margin-top:16px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;font-weight:500;font-size:15px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn.green{background:var(--matcha);border-color:var(--matcha);color:#fff}
:root[data-theme="dark"] .btn.primary,:root[data-theme="dark"] .btn.green{color:#0D1930}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary,:root:not([data-theme="light"]) .btn.green{color:#0D1930}}
.btn.danger{color:var(--shu)}
.btn.danger.armed{background:var(--shu);border-color:var(--shu);color:#fff}
.btn.block{width:100%;padding:12px}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:0;background:none;padding:6px 8px;border-radius:8px;color:var(--muted);font-size:14px}
.icon-btn:hover{background:var(--paper);color:var(--ink)}

/* ---------- App shell ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.wrap{max-width:1140px;margin:0 auto;padding:0 18px}
.top-row{display:flex;align-items:center;gap:12px;height:58px}
.brand{display:flex;align-items:center;line-height:1;gap:10px;font-weight:700;font-size:18px;margin-right:auto}
.logo-mark{position:relative;flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#38BDF8,#2563EB);box-shadow:0 6px 14px -6px rgba(37,99,235,.7);animation:logoFloat 4s ease-in-out infinite}
.logo-mark .jp{color:#fff;font-size:22px;line-height:1;font-weight:700;position:relative;z-index:1}
.logo-shine{position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.7) 50%,transparent 58%);transform:translateX(-110%);animation:logoShine 5s ease-in-out infinite}
.logo-spark{position:absolute;top:1px;right:3px;font-size:9px;color:#fff;font-style:normal;z-index:2;animation:logoTw 2.6s ease-in-out infinite}
.logo-text{display:inline-flex;align-items:baseline;gap:5px}
.logo-text b{color:var(--ink);font-weight:800;letter-spacing:.01em}
.logo-niwa{display:inline-flex}
.logo-niwa span{display:inline-block;font-weight:800;animation:niwaIn .6s cubic-bezier(.2,.9,.3,1.4) both,niwaWave 6s ease-in-out infinite;animation-delay:calc(var(--i)*90ms),calc(1.6s + var(--i)*120ms)}
.logo-niwa span:nth-child(1){color:#2563EB}.logo-niwa span:nth-child(2){color:#2B7BEA}.logo-niwa span:nth-child(3){color:#1E94E6}.logo-niwa span:nth-child(4){color:#0EA5E9}
:root[data-theme="dark"] .logo-niwa span:nth-child(n){filter:brightness(1.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-niwa span:nth-child(n){filter:brightness(1.45)}}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2px) rotate(-4deg)}}
@keyframes logoShine{0%,62%{transform:translateX(-110%)}82%,100%{transform:translateX(110%)}}
@keyframes logoTw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
@keyframes niwaIn{from{opacity:0;transform:translateY(8px) scale(.8)}to{opacity:1;transform:none}}
@keyframes niwaWave{0%,12%,100%{transform:translateY(0)}6%{transform:translateY(-4px)}}
.brand:hover .logo-mark{animation-duration:1.2s}
.brand .jp{font-size:22px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--matcha);background:var(--matcha-soft);color:var(--matcha);border-radius:999px;padding:4px 10px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.who{color:var(--muted);font-size:14px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-row{padding:4px 0 12px;position:relative}
.search-row .input{padding-left:38px}
.search-row svg{position:absolute;left:12px;top:15px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--indigo)}
main{padding:22px 0 60px}
.section-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.section-head h2{margin:0 auto 0 0;font-size:20px;font-weight:700}
.section-head .count{color:var(--muted);font-weight:400;font-size:15px;margin-left:6px}

/* ---------- Card list ---------- */
.cards{display:grid;gap:10px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 14px 14px 16px}
.crow .front{font-size:22px;line-height:1.3;word-break:break-word}
.crow .reading{color:var(--muted);font-size:14px;margin-top:2px}
.crow .meaning{margin-top:6px}
.crow .ex{margin-top:6px;font-size:15px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.crow .src{font-size:12px;color:var(--indigo);margin-top:8px}
.crow .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.empty{text-align:center;padding:40px 20px;background:var(--card);border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
.empty .jp{font-size:44px;color:var(--matcha);display:block;margin-bottom:6px}
.empty p{margin:4px 0 16px}

/* ---------- Decks ---------- */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.deck{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px;min-height:140px}
.deck:hover{border-color:var(--indigo)}
.deck .jp{font-size:34px;line-height:1.1;color:var(--indigo)}
.deck b{font-size:16px}
.deck span{color:var(--muted);font-size:14px}
.deck .n{margin-top:auto;font-size:13px;color:var(--matcha);font-weight:600}
.back{border:0;background:none;color:var(--indigo);padding:0;font-weight:500;margin-bottom:12px}

/* ---------- Garden ---------- */
.garden-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media (max-width:720px){.garden-grid{grid-template-columns:1fr}}
.stage{background:linear-gradient(180deg,#78BEF6 0%,#3F92EA 60%,#2B73D5 100%);color:#fff;border-radius:22px;padding:30px 18px 28px;display:flex;flex-direction:column;align-items:center}
:root[data-theme="dark"] .stage{background:linear-gradient(180deg,#24508E 0%,#1A3D70 62%,#122C55 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stage{background:linear-gradient(180deg,#24508E 0%,#1A3D70 62%,#122C55 100%)}}
.stage .time{color:#fff;font-size:clamp(40px,13vw,58px);font-weight:500;letter-spacing:.02em;margin-top:10px;width:100%;height:1.15em;line-height:1.15;white-space:nowrap;font-variant-numeric:tabular-nums}
.stage{min-width:0;overflow:hidden}
.stage .time-sub{min-height:3em}
.stage .time-sub{color:rgba(255,255,255,.85);text-align:center;margin-bottom:20px}
.stage .btn{border-radius:999px;padding:11px 22px;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.55);color:#fff}
.stage .btn.danger.armed{background:var(--shu);border-color:var(--shu)}
#start-btn{background:#fff;border-color:#fff;color:#2563C9;font-weight:600;font-size:17px;padding:14px 20px;width:min(240px,100%)}
.dial{position:relative;width:min(300px,86%);aspect-ratio:1;margin:4px auto 14px;touch-action:none;border-radius:50%;user-select:none;-webkit-user-select:none}
.dial > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dial:not(.running) > svg{cursor:grab}
.dial:not(.running) > svg:active{cursor:grabbing}
.dial .track{fill:none;stroke:rgba(255,255,255,.22);stroke-width:10}
.dial .arc{fill:none;stroke:#fff;stroke-width:10;stroke-linecap:round}
.dial .disc{fill:url(#bubbleG)}
.dial > svg{filter:drop-shadow(0 0 26px rgba(215,238,255,.55))}
.dial .knob{fill:#fff;stroke:#2D6BD8;stroke-width:4}
.dial:focus-visible{outline-color:#fff}
.dial:focus-visible{outline-offset:6px;border-radius:50%}
.dial-plant{position:absolute;left:50%;top:50%;width:58%;transform:translate(-50%,-50%);pointer-events:none}
.dial-plant .plant{display:block;width:100%;height:auto}
.time{font-size:44px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.time-sub{color:var(--muted);font-size:14px;margin:6px 0 12px}
.bar{width:100%;max-width:320px;height:6px;border-radius:6px;background:var(--matcha-soft);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--matcha);width:0}
.stage-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.picker-title{font-size:15px;font-weight:600;margin:0 0 10px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.pk{--pk-bg:#FFFFFF;--pk-bd:var(--line);--pk-on:var(--indigo);border:1.5px solid var(--pk-bd);background:var(--pk-bg);border-radius:16px;padding:10px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
:root[data-theme="dark"] .pk{background:var(--card);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pk{background:var(--card);color:var(--ink)}}
.pk svg{width:78px;height:98px}
.pk .jp{font-size:21px;line-height:1.15;font-weight:700}
.pk small{font-size:12px;color:var(--muted)}
.pk[aria-pressed="true"]{border-color:var(--pk-on);box-shadow:0 0 0 2px var(--pk-on) inset;background:var(--indigo-soft)}
.pk:disabled{opacity:.45;cursor:default}
.dur{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.dur input{flex:1;min-width:0;accent-color:var(--matcha)}
.dur-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:0 52px 18px}
#dur-val{color:var(--matcha)}
.howto{color:var(--muted);font-size:14px;margin-top:14px}
.stats{display:flex;gap:22px;margin:30px 0 12px;flex-wrap:wrap}
.stats div{font-size:14px;color:var(--muted)}
.stats b{display:block;font-size:26px;color:var(--ink);font-weight:600}
.forest{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.tree{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.tree svg{width:100%;height:auto;max-height:110px}
.tree .jp{font-size:15px}
.tree small{display:block;color:var(--muted);font-size:12px}
.plant.dead{filter:grayscale(1);opacity:.55}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:start center;padding:max(16px,6vh) 16px 16px;background:rgba(15,20,17,.45);overflow-y:auto;overscroll-behavior:contain}
.sheet{width:100%;max-width:480px;max-height:calc(100% - 20px);overflow:auto;background:var(--card);border-radius:16px;padding:20px;box-shadow:var(--shadow);animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 16px;font-size:19px}
.sheet .row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

/* Study */
.study{max-width:560px}
.study-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:var(--muted);font-size:14px}
.flash{width:100%;min-height:260px;border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.flash .f{font-size:clamp(30px,8vw,46px);line-height:1.25;word-break:break-word}
.flash .r{color:var(--muted)}
.flash .m{font-size:19px;font-weight:600}
.flash .e{color:var(--muted);font-size:16px;margin-top:6px}
.flash .hint{color:var(--muted);font-size:13px;margin-top:10px}
.study-acts{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}

/* Celebration */
.celebrate{text-align:center}
.celebrate svg{width:200px;height:auto}
.celebrate p{color:var(--muted);margin:4px 0 16px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

.splash{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--card)}
.lang button{border:0;background:none;padding:3px 9px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.login-lang{display:flex;justify-content:flex-end;margin-bottom:22px}
.crow .meaning-2{font-size:14px;color:var(--muted)}
.flash .m2{font-size:15px;color:var(--muted)}
@media (max-width:520px){.who{display:none}}
/* Phông theo ngôn ngữ: bản Việt ưu tiên phông có đủ dấu, bản Nhật ưu tiên phông tiếng Nhật */
html:lang(ja) body{font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP","Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,sans-serif}
.jp{font-family:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
.lang button[lang="ja"],input.jp::placeholder{font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif}
/* Cố định kích thước header để hai ngôn ngữ không lệch nhau */
.top-row{height:58px}
.lang{flex-shrink:0}
.lang button{height:26px;line-height:1;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;word-break:keep-all;flex-shrink:0}
.top-row .icon-btn{flex-shrink:0}
.top-row .brand{min-width:0;white-space:nowrap}
.icon-btn{height:34px;line-height:22px;white-space:nowrap}
.search-row .input{height:46px;line-height:22px}
nav.tabs button{height:44px;line-height:22px}
.imp-desc{color:var(--muted);font-size:14px;margin:-6px 0 14px}
.imp-pick-wrap{position:relative;display:inline-block;overflow:hidden;border-radius:10px}
.imp-pick{pointer-events:none;padding:12px 22px}
.imp-file{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px}
.imp-pick-wrap:focus-within{outline:2px solid var(--indigo);outline-offset:2px}
.imp-paste{margin-top:12px;min-height:58px;border:1.5px dashed var(--line);border-radius:10px;padding:14px;color:var(--muted);font-size:14px;outline:none;-webkit-user-select:text;user-select:text}
.imp-paste:empty::before{content:attr(data-ph)}
.imp-paste:focus{border-color:var(--indigo)}
.imp-paste img{max-height:40px}
.imp-note{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.imp-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:12px}
.imp-thumbs:empty{display:none}
.imp-th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.imp-th img{width:100%;height:100%;object-fit:cover;display:block}
.imp-th button{position:absolute;top:4px;right:4px;width:26px;height:26px;padding:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:26px}
.imp-scan{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 0;text-align:center;color:var(--muted)}
.spinner{width:34px;height:34px;border:3px solid var(--matcha-soft);border-top-color:var(--matcha);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.imp-prog{margin:0;font-weight:700;color:var(--indigo);min-height:1.4em}
.imp-ok{color:var(--matcha);font-weight:600}
.imp-list{max-height:45vh;overflow:auto;display:grid;gap:6px;margin:10px 0}
.imp-list:empty{display:none}
.imp-item{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:baseline;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.imp-item .jp{font-size:18px}
.imp-item small{color:var(--muted)}
.imp-m{grid-column:1/-1;font-size:14px}
.subseg{max-width:380px;margin-bottom:18px}
.deck-score{color:var(--matcha);font-weight:600;margin:-6px 0 14px}
.df-bar{display:flex;align-items:center;gap:4px;margin:8px 0 4px;font-size:14px;color:var(--muted)}
.df-bar span{margin-right:auto}
.df-list{max-height:40vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.df-list:empty{display:none}
.df-item{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.df-item:last-child{border-bottom:0}
.df-item input{width:18px;height:18px;accent-color:var(--matcha);margin:0}
.df-item .jp{font-size:17px}
.df-item small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip-opt{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:500}
.chip-opt[aria-pressed="true"]{background:var(--matcha-soft);border-color:var(--matcha);color:var(--matcha)}
.qbar{height:4px;background:var(--matcha-soft);border-radius:4px;overflow:hidden;margin-bottom:14px}
.qbar i{display:block;height:100%;background:var(--matcha);transition:width .25s}
.qprompt{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.qprompt .f{font-size:clamp(28px,7vw,40px);line-height:1.25;word-break:break-word}
.qprompt .r{color:var(--muted)}
.qprompt .m{font-size:19px;font-weight:600}
.qprompt small{color:var(--muted);font-size:13px}
.qopts{display:grid;gap:8px}
.qopt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:16px;color:var(--ink)}
.qopt.jp{font-size:19px}
.qopt:not(:disabled):hover{border-color:var(--indigo)}
.qopt:disabled{cursor:default}
.qopt.ok{border-color:var(--matcha);background:var(--matcha-soft)}
.qopt.bad{border-color:var(--shu);background:var(--shu-soft)}
.qfeed{font-weight:600;margin:12px 0 0}
.qfeed.ok{color:var(--matcha)}
.qfeed.bad{color:var(--shu)}
.qresult{text-align:center;padding:10px 0 6px}
.qscore{font-size:56px;font-weight:600;color:var(--matcha);line-height:1}
.qscore small{font-size:24px;color:var(--muted)}
.quiz .row{flex-wrap:wrap}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:16px 0 10px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.guest-btn{background:transparent}
.guest-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--indigo-soft);border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:14px}
.guest-bar span{flex:1;min-width:200px}
.fb{--fb-bg1:#E6EFFC;--fb-bg2:#F4F8FF;--fb-card:#FFFFFF;--fb-navy:#1C3567;--fb-blue:#3F7FE6;--fb-blue2:#5B95F0;--fb-soft:#EAF1FD;--fb-line:#DCE6F6;--fb-muted:#5D7096;--fb-cloud:#FFFFFF;
  position:relative;overflow:hidden;border-radius:26px;padding:24px 24px 34px;background:linear-gradient(160deg,var(--fb-bg1),var(--fb-bg2) 55%,var(--fb-bg1));color:var(--fb-navy)}
:root[data-theme="dark"] .fb{--fb-bg1:#15233D;--fb-bg2:#1B2C4A;--fb-card:#1F3152;--fb-navy:#E3ECFF;--fb-blue:#6EA0F5;--fb-blue2:#82AEF7;--fb-soft:#28406A;--fb-line:#2E4673;--fb-muted:#9FB3D9;--fb-cloud:#22365A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fb{--fb-bg1:#15233D;--fb-bg2:#1B2C4A;--fb-card:#1F3152;--fb-navy:#E3ECFF;--fb-blue:#6EA0F5;--fb-blue2:#82AEF7;--fb-soft:#28406A;--fb-line:#2E4673;--fb-muted:#9FB3D9;--fb-cloud:#22365A}}
.fb-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.fb-title{margin-right:auto}
.fb-title h2{margin:0;font-size:32px;font-weight:800;letter-spacing:-.01em;color:var(--fb-navy)}
.fb-title p{margin:2px 0 0;color:var(--fb-muted);font-size:16px}
.fb-pill{display:flex;align-items:center;gap:14px;background:var(--fb-card);border-radius:999px;padding:10px 20px;font-weight:600;font-size:15px;box-shadow:0 8px 24px -16px rgba(40,80,160,.45)}
.fb-pill i{width:1px;height:20px;background:var(--fb-line)}
.fb-av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;background:linear-gradient(140deg,#7FA8F2,#3F7FE6);border:3px solid var(--fb-card);box-shadow:0 6px 16px -8px rgba(40,80,160,.6)}
.fb-stats{display:grid;grid-template-columns:1.25fr 1fr 1fr;background:var(--fb-card);border-radius:22px;padding:18px 8px;margin-bottom:22px;box-shadow:0 14px 34px -24px rgba(40,80,160,.55)}
.fb-stat{display:flex;align-items:center;gap:14px;padding:2px 22px;min-width:0}
.fb-stat + .fb-stat{border-left:1.5px solid var(--fb-line)}
.fb-ic{flex:none;color:var(--fb-blue);display:grid;place-items:center}
.fb-ic svg{width:34px;height:34px}
.fb-sv{min-width:0}
.fb-sv small{display:block;color:var(--fb-muted);font-size:13px}
.fb-sv b{display:block;font-size:26px;font-weight:800;line-height:1.2;white-space:nowrap;color:var(--fb-navy)}
.fb-bar{flex:1;min-width:60px;height:9px;border-radius:9px;background:var(--fb-soft);overflow:hidden;margin-left:6px}
.fb-bar i{display:block;height:100%;background:var(--fb-blue);border-radius:9px}
.fb-ring{flex:none;width:58px;height:58px;margin-left:auto}
.fb-ring .tr{fill:none;stroke:var(--fb-soft);stroke-width:5.5}
.fb-ring .pr{fill:none;stroke:var(--fb-blue);stroke-width:5.5;stroke-linecap:round}
.fb-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,1fr);gap:22px;align-items:start}
.fb-stage{position:relative;padding:10px 0 120px;min-height:520px;scroll-margin-top:200px}
.fb-wrap{display:flex;align-items:center;gap:16px}
.fb-nav{position:relative;flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:0;background:var(--fb-card);color:var(--fb-blue);box-shadow:0 10px 22px -12px rgba(40,80,160,.55)}
.fb-nav.next{background:linear-gradient(150deg,var(--fb-blue2),var(--fb-blue));color:#fff}
.fb-nav:disabled{opacity:.4;cursor:default}
.fb-swoosh{position:absolute;right:-20px;top:-10px;width:26px;height:40px;pointer-events:none}
.fb-swoosh i{position:absolute;height:4px;border-radius:4px;background:var(--fb-blue2)}
.fb-swoosh i:nth-child(1){width:12px;transform:rotate(-55deg);top:4px;left:2px}
.fb-swoosh i:nth-child(2){width:14px;transform:rotate(-30deg);top:14px;left:8px}
.fb-swoosh i:nth-child(3){width:14px;top:26px;left:10px}
.fb-nav:disabled .fb-swoosh{display:none}
.fb-stack{position:relative;flex:1;min-width:0}
.fb-ghost{position:absolute;inset:16px 34px 0 -18px;border-radius:24px;background:var(--fb-card);opacity:.8;transform:rotate(-3deg);box-shadow:0 14px 30px -22px rgba(40,80,160,.5)}
.fb-card{position:relative;height:400px;perspective:1400px;cursor:pointer;outline:none;transform:rotate(1.5deg)}
.fb-card:focus-visible .fb-face{box-shadow:0 0 0 3px var(--fb-blue)}
.fb-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.fb-card.flipped .fb-inner{transform:rotateY(180deg)}
.fb-face{position:absolute;inset:0;border-radius:26px;background:var(--fb-card);box-shadow:0 26px 50px -26px rgba(40,80,160,.6);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px 26px;overflow:auto}
.fb-back{transform:rotateY(180deg)}
.fb-idx{position:absolute;top:18px;left:22px;font-size:13px;color:var(--fb-muted);font-variant-numeric:tabular-nums}
.fb-idx em{font-style:normal;font-weight:700}
.fb-idx em.ok{color:var(--matcha)}.fb-idx em.ng{color:#D9534A}
.fb-art{position:relative;width:min(210px,52%);aspect-ratio:1;border-radius:50%;background:var(--fb-soft);display:grid;place-items:center;margin-bottom:14px}
.fb-art .jp{font-size:clamp(70px,11vw,110px);line-height:1;color:var(--fb-blue);opacity:.9;font-weight:700}
.fb-art .sp{position:absolute;width:20px;height:5px;border-radius:5px;background:#FFD24D}
.fb-art .s1{right:-24px;top:30%;transform:rotate(-55deg)}
.fb-art .s2{right:-30px;top:42%;transform:rotate(-25deg)}
.fb-art .s3{right:-30px;top:55%}
.fb-art .dot{position:absolute;left:18%;top:16%;width:16px;height:16px;border-radius:50%;background:#FFE08A}
.fb-word{font-size:clamp(34px,5.2vw,54px);font-weight:800;line-height:1.15;color:var(--fb-navy);word-break:break-word}
.fb-read{font-size:22px;color:var(--fb-muted);margin-top:6px}
.fb-bword{font-size:clamp(30px,4.6vw,46px);font-weight:800;color:var(--fb-navy);line-height:1.2}
.fb-mean{font-size:24px;font-weight:700;color:var(--fb-blue);margin-top:16px;line-height:1.4}
.fb-mean2{font-size:16px;color:var(--fb-muted);margin-top:4px}
.fb-ex{margin-top:16px;font-size:16px;color:var(--fb-muted);background:var(--fb-soft);border-radius:14px;padding:10px 16px}
.fb-speak{position:absolute;top:14px;right:16px;z-index:2;width:54px;height:54px;border-radius:50%;border:0;background:var(--fb-soft);color:var(--fb-blue);display:grid;place-items:center;box-shadow:0 6px 14px -8px rgba(40,80,160,.5);transform:rotate(1.5deg)}
.fb-acts{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:34px;position:relative;z-index:2}
.fb-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;padding:16px 28px;min-width:160px;font-weight:700;font-size:18px;border:2px solid #BFD5F7;background:var(--fb-card);color:var(--fb-blue);box-shadow:0 10px 22px -16px rgba(40,80,160,.6)}
.fb-btn.main{background:linear-gradient(150deg,var(--fb-blue2),var(--fb-blue));border-color:transparent;color:#fff;box-shadow:0 14px 26px -12px var(--fb-blue)}
.fb-cat{position:absolute;left:-6px;bottom:0;width:150px;height:auto;z-index:1}
.fb-plane{position:absolute;right:0;bottom:10px;width:120px;height:auto}
.fb-clouds{position:absolute;left:0;right:0;bottom:0;width:100%;height:90px;z-index:0;pointer-events:none}
.fb-empty{background:var(--fb-card);border-radius:22px;padding:60px 20px;text-align:center;color:var(--fb-muted)}
.fb-side{display:flex;flex-direction:column;gap:14px}
.fb-tip{display:flex;align-items:center;gap:12px;background:var(--fb-card);border-radius:20px;padding:14px 18px;font-size:15px;line-height:1.45;box-shadow:0 10px 26px -20px rgba(40,80,160,.5)}
.fb-tip svg{flex:none}
.fb-topic{display:flex;align-items:center;gap:12px;background:var(--fb-card);border-radius:20px;padding:12px 18px;box-shadow:0 10px 26px -20px rgba(40,80,160,.5);cursor:pointer}
.fb-tl{flex:1;min-width:0}
.fb-tl small{display:block;font-size:13px;color:var(--fb-muted)}
.fb-tl select{width:100%;border:0;background:transparent;font-weight:700;font-size:17px;color:var(--fb-navy);padding:2px 0;cursor:pointer;outline:none}
.fb-tl select option{color:#1C3567}
.fb-list{background:var(--fb-card);border-radius:22px;overflow:hidden;box-shadow:0 14px 34px -24px rgba(40,80,160,.55)}
.fb-lhead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.fb-lhead b{font-size:17px}
.fb-lhead span{font-size:13px;color:var(--fb-blue);background:var(--fb-soft);border-radius:999px;padding:2px 10px;font-weight:700}
.fb-tools{display:flex;gap:8px;flex-wrap:wrap;padding:4px 18px 12px;border-bottom:1.5px solid var(--fb-line)}
.fb-tool{border:1.5px solid #BFD5F7;background:var(--fb-card);color:var(--fb-blue);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.fb-tool.main{background:var(--fb-blue);border-color:var(--fb-blue);color:#fff}
.fb-items{max-height:440px;overflow:auto}
.fb-item{display:flex;align-items:center;gap:6px;padding:2px 12px 2px 0;border-bottom:1px solid var(--fb-line);border-left:4px solid transparent}
.fb-item:last-child{border-bottom:0}
.fb-item.on{background:var(--fb-soft);border-left-color:var(--fb-blue)}
.fb-pick{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:10px 4px 10px 14px;color:var(--fb-navy)}
.fb-pick .dot{flex:none;width:10px;height:10px;border-radius:50%;background:#C9D6EC}
.fb-pick .dot.ok{background:var(--matcha)}.fb-pick .dot.ng{background:#D9534A}
.fb-pick .tx{min-width:0;display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:baseline}
.fb-pick .w{font-size:19px;font-weight:700}
.fb-pick .r{font-size:13px;color:var(--fb-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb-pick .m{grid-column:1/-1;font-size:14px;color:var(--fb-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb-iacts{display:flex;gap:4px;flex:none}
.fb-iacts .btn{padding:5px 9px;font-size:13px}
@media (max-width:900px){.fb-grid{grid-template-columns:1fr}.fb-stage{padding-bottom:20px;min-height:0}.fb-cat,.fb-plane{display:none}}
@media (max-width:640px){
  .fb{padding:16px 12px 24px;border-radius:20px}
  .fb-title h2{font-size:26px}.fb-title p{font-size:14px}
  .fb-pill{padding:8px 14px;font-size:13px;gap:10px}.fb-av{width:42px;height:42px;font-size:18px}
  .fb-stats{grid-template-columns:repeat(3,minmax(0,1fr));padding:12px 0}
  .fb-stat{flex-direction:column;align-items:flex-start;gap:4px;padding:2px 10px}
  .fb-ic,.fb-ring{display:none}.fb-sv b{font-size:17px}.fb-bar{width:100%;margin:2px 0 0}
  .fb-wrap{gap:6px}.fb-nav{width:42px;height:42px}.fb-swoosh{display:none}
  .fb-card{height:340px}.fb-art{width:min(130px,46%)}.fb-art .jp{font-size:64px}.fb-art .sp{display:none}.fb-btn span{white-space:nowrap}.fb-btn{font-size:13.5px!important}
  .fb-acts{gap:8px;flex-wrap:nowrap;margin-top:22px}.fb-btn{flex:1 1 0;min-width:0;padding:12px 6px;font-size:14px;gap:5px}.fb-btn svg{width:17px;height:17px}
}
/* ---------- Học thẻ ---------- */
.sd-modal{background:rgba(110,140,215,.42);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);overflow-x:hidden}
.sd-bub{position:absolute;border-radius:50%;pointer-events:none;animation:sdFloat 9s ease-in-out infinite}
.sd-bub.b1{width:90px;height:90px;left:8%;top:22%;background:rgba(255,255,255,.45)}
.sd-bub.b2{width:140px;height:140px;right:9%;top:62%;background:rgba(120,190,250,.45);animation-delay:-3s}
.sd-bub.b3{width:60px;height:60px;left:18%;bottom:8%;background:rgba(255,255,255,.5);animation-delay:-6s}
@keyframes sdFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
.sd{--sd-navy:#1E3A8A;--sd-blue:#2563EB;--sd-sky:#38BDF8;--sd-soft:#E8F3FE;--sd-line:#BFDDF7;--sd-text:#1E3A6E;--sd-muted:#4B6A9B;
  position:relative;max-width:680px;max-height:none;overflow:visible;margin-top:44px;border-radius:30px;padding:26px 28px 20px;background:#fff;color:var(--sd-text);
  border:6px solid rgba(255,255,255,.7);box-shadow:0 0 0 1px rgba(150,180,240,.5),0 30px 70px -30px rgba(30,60,150,.55);animation:sdPop .35s cubic-bezier(.2,.9,.3,1.2)}
:root[data-theme="dark"] .sd{--sd-navy:#DCE8FF;--sd-blue:#6CA2F7;--sd-sky:#5CCBFA;--sd-soft:#1C3459;--sd-line:#2D4F84;--sd-text:#E3ECFB;--sd-muted:#9DB3D8;background:#14243F;border-color:rgba(40,70,120,.7)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sd{--sd-navy:#DCE8FF;--sd-blue:#6CA2F7;--sd-sky:#5CCBFA;--sd-soft:#1C3459;--sd-line:#2D4F84;--sd-text:#E3ECFB;--sd-muted:#9DB3D8;background:#14243F;border-color:rgba(40,70,120,.7)}}
@keyframes sdPop{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.sd-cloud{position:absolute;right:26px;top:-50px;animation:sdBob 3.2s ease-in-out infinite;pointer-events:none}
@keyframes sdBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.sd-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.sd-ic{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--sd-soft);color:var(--sd-blue)}
.sd-ht{flex:1;min-width:0}
.sd-title{font-weight:800;font-size:17px;color:var(--sd-navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd-jp{color:var(--sd-sky);font-family:inherit}
.sd-bar{height:8px;border-radius:8px;background:var(--sd-soft);margin-top:8px;overflow:hidden}
.sd-bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--sd-sky),var(--sd-blue));transition:width .35s ease}
.sd-count{flex:none;background:var(--sd-soft);color:var(--sd-navy);font-weight:800;font-size:15px;border-radius:999px;padding:7px 14px;font-variant-numeric:tabular-nums}
.sd-card{position:relative;height:300px;perspective:1400px;cursor:pointer;outline:none}
.sd-card.in-next{animation:sdInR .38s cubic-bezier(.2,.8,.3,1)}
.sd-card.in-prev{animation:sdInL .38s cubic-bezier(.2,.8,.3,1)}
@keyframes sdInR{from{opacity:0;transform:translateX(46px) rotate(2deg)}to{opacity:1;transform:none}}
@keyframes sdInL{from{opacity:0;transform:translateX(-46px) rotate(-2deg)}to{opacity:1;transform:none}}
.sd-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,.7,.25,1);transform-style:preserve-3d}
.sd-card.flipped .sd-inner{transform:rotateY(180deg)}

const Store = {
  db:null, uid:null, mem:{}, busy:{}, pend:{}, ready:null,
  init(){
    this.ready = (async()=>{
      const c = window.claude;
      if(!c || typeof c.use !== 'function') return;
      try{
        const timeout = new Promise(r=>setTimeout(()=>r([null,null]),9000));
        const [db,user] = await Promise.race([Promise.all([c.use('db'), c.use('user')]), timeout]);
        if(db && user){ const id = await user.id(); if(id){ this.db = db; this.uid = id; } }
      }catch(e){}
    })();
    return this.ready;
  },
  path(k){ return 'data/users/'+this.uid+'/'+k; },
  local(k){ try{ const v = localStorage.getItem('bjtniwa_'+k); if(v) return JSON.parse(v); }catch(e){} return this.mem[k] || null; },
  async get(k){
    await this.ready;
    if(this.db){
      try{ const s = await this.db.doc(this.path(k)).get(); if(s.exists) return JSON.parse(JSON.stringify(s.data())); }catch(e){}  /* data() bị đóng băng: sao chép ra bản sửa được */
    }
    return this.local(k);
  },
  async set(k,v){
    this.mem[k] = v;
    try{ localStorage.setItem('bjtniwa_'+k, JSON.stringify(v)); }catch(e){}
    await this.ready;
    if(!this.db) return;
    if(this.busy[k]){ this.pend[k] = v; return; }
    this.busy[k] = true;
    let cur = v;
    while(cur){
      try{ await this.db.doc(this.path(k)).set(cur); }
      catch(e){ toast(t('toastSaveFail')); }
      cur = this.pend[k]; delete this.pend[k];
    }
    this.busy[k] = false;
  }
};
const LS = {
  get(k){ try{ const v = localStorage.getItem('bjtniwa_'+k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k,v){ try{ if(v===null) localStorage.removeItem('bjtniwa_'+k); else localStorage.setItem('bjtniwa_'+k, JSON.stringify(v)); }catch(e){} }
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmt = ms => { const s = Math.max(0, Math.ceil(ms/1000)), h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = String(s%60).padStart(2,'0');
  return h ? h+':'+String(m).padStart(2,'0')+':'+sec : String(m).padStart(2,'0')+':'+sec; };
const fmtDate = ts => { try{ return new Date(ts).toLocaleDateString({vi:'vi-VN',ja:'ja-JP'}[LANG]); }catch(e){ const d=new Date(ts); return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear(); } };
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d'); }
function hl(text, q){
  const s = String(text||''); if(!q) return esc(s);
  const ns = norm(s), nq = norm(q); const i = ns.indexOf(nq);
  if(i < 0 || ns.length !== s.length) return esc(s);
  return esc(s.slice(0,i)) + '<mark class="hl">' + esc(s.slice(i,i+q.length)) + '</mark>' + esc(s.slice(i+q.length));
}
const isEn = c => !!(c && c.lang === 'en');
const fc = c => isEn(c) ? 'en-w' : 'jp';
/* Nghĩa hiển thị theo ngôn ngữ: VI → tiếng Việt, EN → tiếng Anh, 日本語 → cả hai */
function meanings(c){
  const vi = c.meaning || '', en = c.meaningEn || '';
  const src = c.src && PRESETS.flatMap(d=>d.cards).find(x=>x.id===c.src);
  const ja = c.meaningJa || (src && src.meaningJa) || '';
  if(LANG==='ja') return [ja || vi || en];
  return [vi || en || ja];
}
let toastTimer;
function toast(msg){
  let el = $('#toast'); if(!el){ el = document.createElement('div'); el.id='toast'; el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.textContent = msg; el.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.add('hidden'), 2800);
}
async function sha(s){
  try{ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let h=0; for(const ch of s){ h=(h*31+ch.charCodeAt(0))|0; } return 'x'+h; }
}

  } else if(type==='himawari'){
    const H = 20 + 110*g, top = gy - H;
    s += `<path d="M100 ${gy} Q 103 ${f1(gy-H*0.5)} 100 ${f1(top)}" stroke="#4E9A33" stroke-width="${f1(3+3*g)}" fill="none" stroke-linecap="round"/>`;
    if(g > 0.25){ const k = Math.min(1,(g-0.25)/0.45);
      const big = (x,y,sz,dir)=>`<g transform="translate(${f1(x)} ${f1(y)}) scale(${dir} 1)"><path d="M0 0 C ${f1(sz*0.2)} ${f1(-sz*0.6)}, ${f1(sz)} ${f1(-sz*0.75)}, ${f1(sz*1.1)} ${f1(-sz*0.1)} C ${f1(sz*0.8)} ${f1(sz*0.38)}, ${f1(sz*0.3)} ${f1(sz*0.3)}, 0 0Z" fill="#5DAA3F"/><path d="M0 0 Q ${f1(sz*0.5)} ${f1(-sz*0.25)} ${f1(sz*1.0)} ${f1(-sz*0.12)}" stroke="#468A2F" stroke-width="1" fill="none"/></g>`;
      s += big(101, gy-H*0.32, 30*k, 1) + big(99, gy-H*0.52, 26*k, -1) + big(100, gy-H*0.14, 16*k, -1);
    }
    if(g < 0.55){ s += `<circle cx="100" cy="${f1(top)}" r="${f1(3+5*g)}" fill="#6FB443"/>`; }
    else {
      const k = (g-0.55)/0.45, R = 12 + 13*k;
      for(let i=0;i<16;i++) s += `<ellipse cx="100" cy="${f1(top-R*0.62)}" rx="${f1(3+2.6*k)}" ry="${f1(R*0.5)}" fill="#EFAF16" transform="rotate(${i*22.5+11} 100 ${f1(top)})"/>`;
      for(let i=0;i<16;i++) s += `<ellipse cx="100" cy="${f1(top-R*0.6)}" rx="${f1(3+2.6*k)}" ry="${f1(R*0.48)}" fill="#FFD53D" transform="rotate(${i*22.5} 100 ${f1(top)})"/>`;
      s += `<circle cx="100" cy="${f1(top)}" r="${f1(R*0.5)}" fill="#6B3F1F"/><circle cx="100" cy="${f1(top)}" r="${f1(R*0.36)}" fill="#8A5428"/>`;
      [[-3,-2],[3,-3],[0,3],[-4,3],[4,2],[0,-5]].forEach(([dx,dy])=>{ s += `<circle cx="${f1(100+dx*R/22)}" cy="${f1(top+dy*R/22)}" r="${f1(0.9+0.4*k)}" fill="#4E2C14"/>`; });
    }
  }
  const p = PLANTS.find(x=>x.id===type);
  return `<svg viewBox="0 0 200 250" class="plant${opts.dead?' dead':''}" role="img" aria-label="${esc(p?plantName(p):'')}">${pot}${s}</svg>`;
}

async function onAuth(e){
  e.preventDefault();
  const f = e.target, err = $('#auth-err'), btn = $('#auth-btn');
  const label = authMode==='login' ? t('login') : t('register');
  const u = f.elements.u.value.trim().toLowerCase(), p = f.elements.p.value;
  if(!/^[a-z0-9_]{3,20}$/.test(u)){ err.textContent = t('errUser'); return; }
  if(p.length < 4){ err.textContent = t('errPass'); return; }
  btn.disabled = true; btn.textContent = t('processing'); err.textContent = '';
  const acc = (await Store.get('accounts')) || {users:{}};
  acc.users = acc.users || {};
  if(authMode === 'register'){
    if(acc.users[u]){ btn.disabled=false; btn.textContent=label; err.textContent = t('errTaken'); return; }
    const salt = uid();
    acc.users[u] = {salt, hash: await sha(salt+':'+p), created: Date.now()};
    await Store.set('accounts', acc);
    /* Chuyển dữ liệu dùng thử sang tài khoản mới */
    if(S.fromGuest){
      S.fromGuest = false;
      const g = await Store.get('u_'+GUEST);
      if(g && ((g.cards||[]).length || (g.garden||[]).length || (g.decks||[]).length || g.timer)){
        await Store.set('u_'+u, g);
        await Store.set('u_'+GUEST, {cards:[], garden:[], decks:[], timer:null});
        const gt = LS.get('timer_'+GUEST); if(gt){ LS.set('timer_'+u, gt); LS.set('timer_'+GUEST, null); }
        setTimeout(()=>toast(t('guestMoved')), 300);
      }
    }
  } else {
    const a = acc.users[u];
    if(!a){ btn.disabled=false; btn.textContent=label; err.textContent = t('errNoUser'); return; }
    if(a.hash !== await sha(a.salt+':'+p)){ btn.disabled=false; btn.textContent=label; err.textContent = t('errPassWrong'); return; }
  }
  await enter(u);
}
async function enter(u){
  S.user = u;
  LS.set('session', u);
  const d = await Store.get('u_'+u);
  S.data = {cards: (d && d.cards) || [], garden: (d && d.garden) || [], decks: (d && d.decks) || [], timer: null, stats: (d && d.stats) || null, audio: (d && d.audio) || [], pts: (d && d.pts) || 0, days: (d && d.days) || []};
  S.fi = 0; S.fflip = false; S.fdeck = ''; S.pickSet = new Set();
  S.cv = 'cards'; S.myDeck = null;

  S.timer = (d && 'timer' in d) ? (d.timer || null) : LS.get('timer_'+u);
  S.data.timer = S.timer;
  if(S.timer && S.timer.plant) S.sel = S.timer.plant;
  renderShell();
}

/* Tách câu ví dụ thành câu gốc (Anh/Nhật) và câu dịch tiếng Việt */
const VI_RE = /[àáảãạăằắẳẵặâầấẩẫậđèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵ]/i;
function splitExample(ex){
  const s = String(ex || '').trim(); if(!s) return {src:'', tr:''};
  const m = s.match(/^([\s\S]+?)\s*(?:→|⇒|=>|->|\||\n|\s[–—-]\s|\s=\s)\s*([\s\S]+)$/);
  if(m && (VI_RE.test(m[2]) || /[\u3040-\u30FF\u3400-\u9FFF]/.test(m[1]))) return {src:m[1].trim(), tr:m[2].trim()};
  /* Không có dấu phân cách: tách ở cuối câu gốc nếu phần sau là tiếng Việt */
  const m2 = s.match(/^(.+?[.!?。！？])\s*[(（]?(.+?)[)）]?$/);
  if(m2 && !VI_RE.test(m2[1]) && VI_RE.test(m2[2])) return {src:m2[1].trim(), tr:m2[2].trim()};
  const m3 = s.match(/^(.+?)\s*[(（]([^()（）]+)[)）]\s*$/);
  if(m3 && !VI_RE.test(m3[1]) && VI_RE.test(m3[2])) return {src:m3[1].trim(), tr:m3[2].trim()};
  return {src:s, tr:''};
}
function exHTML(c, cls){
  const {src, tr} = splitExample(c.example);
  if(!src) return '';
  return `<div class="ex-box ${cls}">

}

/* Vòng tròn chọn thời gian quanh chậu cây */
const DIAL_C = 2*Math.PI*136;
function dialHTML(frac, running, plant){
  const ticks = '';
  const a11y = running ? '' : `role="slider" tabindex="0" aria-label="${t('pickTime')}" aria-valuemin="10" aria-valuemax="180" aria-valuenow="${S.mins}" aria-valuetext="${durLabel(S.mins)}"`;

      <circle cx="150" cy="150" r="136" class="track"/>
      <circle id="dial-arc" cx="150" cy="150" r="136" class="arc" stroke-dasharray="${frac*DIAL_C} ${DIAL_C}" transform="rotate(-90 150 150)"/>
      ${ticks}
      <defs><radialGradient id="bubbleG" cx="40%" cy="34%" r="72%"><stop offset="0" stop-color="#F6FBFF"/><stop offset=".55" stop-color="#D2E8FC"/><stop offset="1" stop-color="#A8CFF4"/></radialGradient></defs>
      <circle cx="150" cy="150" r="121" class="disc"/>
      <ellipse cx="206" cy="82" rx="24" ry="12" fill="#fff" opacity=".35" transform="rotate(38 206 82)"/>
      <g id="dial-knob" transform="rotate(${frac*360} 150 150)" ${running?'style="display:none"':''}><circle cx="150" cy="14" r="15" class="knob"/></g>
    </svg>
    <div class="dial-plant" id="stage-plant">${plant}</div>
  </div>`;
}
function dialRender(frac, knob){
  const a = $('#dial-arc'); if(a) a.setAttribute('stroke-dasharray', (frac*DIAL_C)+' '+DIAL_C);
  const k = $('#dial-knob'); if(k){ k.setAttribute('transform', `rotate(${frac*360} 150 150)`); k.style.display = knob ? '' : 'none'; }
  const d = $('#dial'); if(d && !S.timer){ d.setAttribute('aria-valuenow', S.mins); d.setAttribute('aria-valuetext', durLabel(S.mins)); }
}
let dialDrag = false;
function dialPoint(e){
  const r = $('#dial-svg').getBoundingClientRect();
  const x = e.clientX-(r.left+r.width/2), y = e.clientY-(r.top+r.height/2);
  let a = Math.atan2(x, -y)*180/Math.PI; if(a < 0) a += 360;
  return {mins: a/360*180, dist: Math.hypot(x,y)/(r.width/2)};
}
function dialMove(e){
  let m = dialPoint(e).mins;
  if(S.mins >= 150 && m < 60) m = 180;      /* không nhảy qua đỉnh vòng */
  else if(S.mins <= 40 && m > 120) m = 10;
  setMins(m);
}
document.addEventListener('pointerdown', e=>{
  const svg = e.target.closest('#dial-svg'); if(!svg || S.timer) return;
  if(dialPoint(e).dist < 0.66) return;     /* chạm vào chậu cây thì không đổi */
  dialDrag = true; try{ svg.setPointerCapture(e.pointerId); }catch(_){}

});

let completing = false;
async function completeTree(){
  if(completing || !S.timer || !S.user) return;
  completing = true;
  markStudyDay();
  const tm = S.timer, dur = tdur(), plant = tm.plant, min = Math.round(dur/60000);
  /* id cố định theo thời điểm bắt đầu: mở nhiều cửa sổ cũng không bị ghi trùng */
  const tree = {id:'t'+tm.startedAt, plant, at:tm.startedAt+dur, min};
  S.timer = null; LS.set('timer_'+S.user, null); S.data.timer = null;
  try{
    if(!S.data.garden.some(x=>x.id===tree.id)) S.data.garden.push(tree);
    /* Gộp với khu vườn đã lưu (vd. từ máy khác) để không ghi đè mất cây */
    const latest = await Store.get('u_'+S.user).catch(()=>null);
    if(latest && Array.isArray(latest.garden)){
      const ids = new Set(S.data.garden.map(x=>x.id));
      latest.garden.forEach(x=>{ if(x && x.id && !ids.has(x.id)){ ids.add(x.id); S.data.garden.push(x); } });
      S.data.garden.sort((a,b)=>(a.at||0)-(b.at||0));
    }
  }catch(e){ console.error(e); }
  saveData();
  completing = false;
  try{ renderContent(); updateTimerUI(); }catch(e){ console.error(e); }
  const pl = PLANTS.find(x=>x.id===plant) || PLANTS[0];
  openModal(`<div class="sheet celebrate">${plantSVG(plant,1)}<h3>${esc(t('grownTitle',plantName(pl)))} <span class="jp">${LANG==='ja'?'':pl.jp}</span></h3>

}

/* ===================== Cách đọc tiếng Nhật tự động ===================== */
const KANA_RE = /^[\u3040-\u309F\u30A0-\u30FF\u301C\uFF5E\u30FB\s、。！？!?]+$/;
const toHira = s => s.replace(/[\u30A1-\u30F6]/g, ch=>String.fromCharCode(ch.charCodeAt(0) - 0x60));
function knownReading(front, lg='ja'){
  const key = lg === 'en' ? front.toLowerCase() : front;
  for(const c of [...S.data.cards, ...PRESETS.flatMap(d=>d.cards)]){
    if((c.lang || 'ja') !== lg || !c.reading) continue;
    const f = String(c.front).trim();
    if((lg === 'en' ? f.toLowerCase() : f) === key) return c.reading;
  }
  return '';
}
function knownCard(front, lg){
  const key = front.toLowerCase();
  return [...S.data.cards, ...PRESETS.flatMap(d=>d.cards)].find(c=>(c.lang || 'ja') === lg && String(c.front).trim().toLowerCase() === key && (c.reading || c.example)) || null;
}
const ipaCache = new Map();
async function aiEn(front, signal){
  const key = front.toLowerCase();
  if(ipaCache.has(key)) return ipaCache.get(key);
  const r = await SAMPLE.json('For this English word or phrase give (1) its standard British English IPA pronunciation as in the Cambridge or Oxford dictionary, with stress marks and without slashes, '
    + 'and (2) one natural example sentence of 8 to 16 words that uses it, suitable for IELTS. '
    + 'Reply with only JSON like {"ipa":"ˈvʌlnərəbl","example":"Older people are more vulnerable to infections in winter."}.\n\nWord: ' + front, {modelTier:'quick', signal});
  let ipa = r && typeof r.ipa === 'string' ? r.ipa.trim().replace(/^[\/\[]+|[\/\]]+$/g,'') : '';
  if(ipa.length > 80 || /[\u3040-\u30FF\u3400-\u9FFF]/.test(ipa)) ipa = '';
  const example = r && typeof r.example === 'string' ? r.example.trim().slice(0, 300) : '';
  const out = {ipa, example};
  if(ipa || example) ipaCache.set(key, out);
  return out;
}
/* Bổ sung ví dụ và phiên âm cho các thẻ tiếng Anh đã có */
function enMissing(){ return S.data.cards.filter(c=>isEn(c) && (!c.example || !c.reading)); }
async function fillEnExamples(){
  const list = enMissing(); if(!list.length || !SAMPLE) return;
  openModal(`<div class="sheet" id="enfill"></div>`, {dismiss:false});
  const ctl = new AbortController(); S.enFill = {ctl};
  let done = 0;
  const draw = (txt, fin) => { const el = $('#enfill'); if(!el) return;
    el.innerHTML = `<h3>${t('exFillTitle')}</h3><div class="imp-scan">${fin ? '' : '<span class="spinner" aria-hidden="true"></span>'}<p role="status">${txt}</p></div>
      <div class="row"><button class="btn${fin ? ' primary' : ''}" data-act="close-modal">${fin ? t('done') : t('stop')}</button></div>`; };
  draw(t('exFilling', 0, list.length));
  for(let i = 0; i < list.length; i += 15){
    const batch = list.slice(i, i + 15);
    try{
      const res = await SAMPLE.json('For each English word or phrase below, give its standard British English IPA (with stress marks, no slashes) and one natural example sentence of 8 to 16 words using it, suitable for IELTS. '
        + 'Reply with only a JSON array of objects {"front","ipa","example"} in the same order as the list.\n\n' + batch.map(c=>c.front).join('\n'), {modelTier:'quick', signal:ctl.signal});
      if(!$('#enfill')) return;
      const arr = Array.isArray(res) ? res : [];
      batch.forEach((c, k)=>{
        const r = arr.find(x=>x && String(x.front || '').trim().toLowerCase() === String(c.front).trim().toLowerCase()) || (arr.length === batch.length ? arr[k] : null);
        if(!r) return;
        let used = false;
        if(!c.example && typeof r.example === 'string' && r.example.trim()){ c.example = r.example.trim().slice(0, 300); used = true; }
        if(!c.reading && typeof r.ipa === 'string' && r.ipa.trim()){ c.reading = r.ipa.trim().replace(/^[\/\[]+|[\/\]]+$/g,'').slice(0, 80); used = true; }
        if(used) done++;
      });
      saveData();
      draw(t('exFilling', Math.min(i + 15, list.length), list.length));
    }catch(e){
      if(!$('#enfill') || (e && e.code === 'cancelled')){ renderContent(); return; }
      saveData(); renderContent(); draw(t('exFillErr', done), true); return;
    }
  }
  renderContent(); draw(t('exFillDone', done), true);
}
const readingCache = new Map();
async function aiReading(front, signal){
  if(readingCache.has(front)) return readingCache.get(front);
  const r = await SAMPLE.json('Give the standard reading of this Japanese word or phrase, written entirely in hiragana (no kanji, no katakana, no romaji). '
    + 'Keep any part that is already hiragana. Reply with only JSON like {"reading":"しょうち"}.\n\nWord: ' + front, {modelTier:'quick', signal});
  const rd = r && typeof r.reading === 'string' ? toHira(r.reading.trim()) : '';
  if(rd && /^[\u3040-\u309F\u30FC\s、。〜！？]+$/.test(rd)){ readingCache.set(front, rd); return rd; }
  return '';
}
function cardForm(card){
  const c = card || {front:'',reading:'',meaning:'',meaningEn:'',meaningJa:'',example:''};
  const isEdit = !!(card && card.id);
  let lang = isEdit ? (c.lang || 'ja') : (c.lang || S.formLang || (S.fdeck==='@en' ? 'en' : 'ja'));
  openModal(`<form class="sheet" id="cform" novalidate autocomplete="off">
    <h3>${isEdit ? t('editCard') : t('newCard')}</h3>
    ${isEdit ? '' : `<button type="button" class="xls-link" data-act="xls-from-form">📊 ${t('xlsFromForm')}</button>`}
    <div class="seg form-lang" role="group" aria-label="${t('cardLang')}">
      <button type="button" data-flang="ja">${t('langJa')}</button>
      <button type="button" data-flang="en">${t('langEn')}</button>
    </div>
    <label class="field"><span id="lb-front"></span><input class="input" name="front" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${esc(c.front)}"></label>
    <label class="field"><span id="lb-reading"></span><input class="input" name="reading" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${esc(c.reading)}"><small class="rd-status" id="rd-status" aria-live="polite"></small></label>
    <label class="field"><span>${t('fVi')}</span><input class="input" name="meaning" lang="vi" autocomplete="off" value="${esc(c.meaning)}"></label>
    <label class="field" id="fl-ja"><span>${t('fJa')}</span><input class="input jp" name="meaningJa" lang="ja" autocomplete="off" autocorrect="off" spellcheck="false" value="${esc(c.meaningJa)}"></label>
    <label class="field" id="fl-en"><span>${t('fEnDef')}</span><input class="input" name="meaningEn" lang="en" autocomplete="off" value="${esc(c.meaningEn)}"></label>
    <label class="field"><span>${t('fEx')}</span><textarea class="input" name="example">${esc(c.example)}</textarea><small class="rd-status" id="ex-status" aria-live="polite"></small></label>
    <div class="err" id="cerr" role="alert"></div>
    <div class="row"><button type="button" class="btn" data-act="close-modal">${t('cancel')}</button>
      <button type="submit" class="btn primary">${isEdit ? t('saveChanges') : t('addCard')}</button></div>
  </form>`, {dismiss:false});
  const fm = $('#cform');
  const applyLang = l => {
    lang = l;
    fm.querySelectorAll('[data-flang]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.flang===l));
    $('#lb-front').textContent = l==='en' ? t('fFrontEn') : t('fFront');
    $('#lb-reading').textContent = l==='en' ? t('fIpa') : t('fReading');
    const fr = fm.elements.front, rd = fm.elements.reading, ex = fm.elements.example;
    fr.placeholder = l==='en' ? 'e.g. significant' : '例: 承知いたしました';
    rd.placeholder = l==='en' ? 'sɪɡˈnɪfɪkənt' : 'しょうちいたしました';
    [fr, rd, ex].forEach(x=>{ x.classList.toggle('jp', l==='ja'); x.classList.toggle('en-w', l==='en'); x.setAttribute('lang', l); });
    $('#fl-ja').classList.toggle('hidden', l==='en');
    $('#fl-en').classList.toggle('hidden', l!=='en');
  };
  fm.querySelectorAll('[data-flang]').forEach(b=>b.onclick = ()=>{ applyLang(b.dataset.flang); autoRead(); });
  applyLang(lang);
  /* Tự điền cách đọc tiếng Nhật khi gõ mặt trước */
  const rdEl = fm.elements.reading, frEl = fm.elements.front, rdSt = $('#rd-status');
  let autoVal = '', rdCtl = null, rdTimer = null;
  const setSt = (txt, cls='') => { rdSt.textContent = txt; rdSt.className = 'rd-status' + (cls ? ' ' + cls : ''); };
  const canAuto = () => rdEl.value.trim() === '' || rdEl.value === autoVal;
  const exEl = fm.elements.example, exSt = $('#ex-status');
  let autoEx = '';
  const canAutoEx = () => exEl.value.trim() === '' || exEl.value === autoEx;
  const setEx = v => { exEl.value = autoEx = v; exSt.textContent = t('exAuto'); exSt.className = 'rd-status ok'; };
  exEl.addEventListener('input', ()=>{ if(exEl.value !== autoEx){ autoEx = ''; exSt.textContent = ''; exSt.className = 'rd-status'; } });
  const msg = k => t((lang === 'en' ? 'ipa' : 'rd') + k);
  async function autoRead(){
    clearTimeout(rdTimer); if(rdCtl) rdCtl.abort(); rdCtl = null;
    if(!fm.isConnected) return;
    const f = frEl.value.trim();
    if(lang === 'en'){
      /* Tiếng Anh: phiên âm IPA và câu ví dụ */
      const needR = canAuto(), needE = canAutoEx();
      if(!f){ if(autoVal && rdEl.value === autoVal) rdEl.value = ''; if(autoEx && exEl.value === autoEx){ exEl.value = ''; exSt.textContent = ''; } autoVal = autoEx = ''; setSt(''); return; }
      if(!needR && !needE) return;
      if(!/[A-Za-z]/.test(f) || /[\u3040-\u30FF\u3400-\u9FFF]/.test(f)){ setSt(''); return; }
      const kc = knownCard(f, 'en');
      if(kc){ if(needR && kc.reading){ rdEl.value = autoVal = '/' + kc.reading + '/'; setSt(msg('Auto'), 'ok'); } if(needE && kc.example) setEx(kc.example);
        if((!needR || kc.reading) && (!needE || kc.example)) return; }
      if(!SAMPLE){ if(needR && !rdEl.value.trim()) setSt(msg('Manual')); return; }
      const ctl = rdCtl = new AbortController(); if(needR) setSt(msg('Loading'), 'busy');
      if(needE && !exEl.value.trim()){ exSt.textContent = t('exLoading'); exSt.className = 'rd-status busy'; }
      try{
        const r = await aiEn(f, ctl.signal);
        if(ctl !== rdCtl || !fm.isConnected || lang !== 'en' || frEl.value.trim() !== f) return;
        if(canAuto()){ if(r.ipa){ rdEl.value = autoVal = '/' + r.ipa + '/'; setSt(msg('Auto'), 'ok'); } else setSt(msg('Manual')); }
        if(canAutoEx()){ if(r.example) setEx(r.example); else { exSt.textContent = ''; exSt.className = 'rd-status'; } }
      }catch(e){ if(ctl !== rdCtl || (e && e.code === 'cancelled')) return; setSt(msg('Manual')); exSt.textContent = ''; exSt.className = 'rd-status'; }
      return;
    }
    if(!canAuto()) return;
    if(!f){ if(autoVal && rdEl.value === autoVal) rdEl.value = ''; autoVal = ''; setSt(''); return; }
    const r = KANA_RE.test(f) ? toHira(f).replace(/\s+/g,'') : knownReading(f, 'ja');
    if(r){ rdEl.value = autoVal = r; setSt(msg('Auto'), 'ok'); return; }
    if(!/[\u3400-\u9FFF\uF900-\uFAFF]/.test(f)){ setSt(''); return; }
    if(!SAMPLE){ setSt(msg('Manual')); return; }
    const ctl = rdCtl = new AbortController(); setSt(msg('Loading'), 'busy');
    try{
      const rd = await aiReading(f, ctl.signal);
      if(ctl !== rdCtl || !fm.isConnected || lang !== 'ja') return;
      if(rd && canAuto() && frEl.value.trim() === f){ rdEl.value = autoVal = rd; setSt(msg('Auto'), 'ok'); }
      else if(!rd) setSt(msg('Manual'));
    }catch(e){ if(ctl !== rdCtl || (e && e.code === 'cancelled')) return; setSt(msg('Manual')); }
  }
  frEl.addEventListener('input', ()=>{ clearTimeout(rdTimer); rdTimer = setTimeout(autoRead, 700); });
  frEl.addEventListener('blur', ()=>{ autoRead(); });
  rdEl.addEventListener('input', ()=>{ if(rdEl.value !== autoVal){ autoVal = ''; if(rdCtl){ rdCtl.abort(); rdCtl = null; } setSt(''); } });
  if(!isEdit && c.front) autoRead();
  /* Chặn lỗi bàn phím điện thoại đổ chữ đang gõ dở của ô trước sang ô vừa chạm vào */
  let lastVal = '', focusAt = 0, wasEmpty = false;
  fm.addEventListener('focusout', e=>{ if(e.target.matches('input,textarea')) lastVal = e.target.value; });
  fm.addEventListener('focusin', e=>{ if(e.target.matches('input,textarea')){ focusAt = Date.now(); wasEmpty = e.target.value === ''; } });
  const leaked = el => wasEmpty && Date.now()-focusAt < 900 && lastVal && el.value && (lastVal === el.value || lastVal.endsWith(el.value));
  const scrub = e=>{ const el = e.target; if(!el.matches || !el.matches('input,textarea')) return false;
    if(leaked(el)){ el.value = ''; return true; } return false; };
  fm.addEventListener('compositionend', e=>{ setTimeout(()=>scrub(e), 0); });
  fm.addEventListener('input', e=>{
    if(scrub(e)) return;
    if(!e.isComposing) wasEmpty = false;
    const er = $('#cerr'); if(er && er.textContent) er.textContent = '';
  });
  fm.onsubmit = async e=>{
    e.preventDefault();
    const f = e.target;
    if(document.activeElement && f.contains(document.activeElement)) document.activeElement.blur();
    await new Promise(r=>setTimeout(r, 80));
    if(!f.isConnected) return;
    const v = k => String((f.elements[k] && f.elements[k].value) || '').replace(/[\s\u3000\u200b\ufeff]+/g, ' ').trim();
    const second = lang==='en' ? v('meaningEn') : v('meaningJa');
    if(!v('front') || (!v('meaning') && !second)){ const er = $('#cerr'); er.textContent = t('errCard'); er.scrollIntoView({block:'nearest'}); toast(t('errCard')); return; }
    const reading = lang==='en' ? v('reading').replace(/^[\/\[]+|[\/\]]+$/g,'') : v('reading');
    const vals = {lang, front:v('front'), reading, meaning:v('meaning'),
      meaningEn: lang==='en' ? v('meaningEn') : ((card && card.meaningEn) || ''),
      meaningJa: lang==='en' ? '' : v('meaningJa'), example:v('example')};
    S.formLang = lang;
    if(isEdit){
      Object.assign(S.data.cards.find(x=>x.id===card.id), vals);
      toast(t('toastSaved'));
    } else {
      S.data.cards.push({id:uid(), ...vals, at:Date.now()});
      toast(t('toastCardAdded'));
    }
    saveData(); closeModal(); renderContent();
  };
}

/* Tự thu nhỏ chữ với từ vựng dài để vừa khung thẻ, không cần cuộn */
function fitFaces(root){
  (root || document).querySelectorAll('.fb-face,.sd-face,.qz-prompt').forEach(face=>{
    const els = [...face.querySelectorAll('.fb-word,.fb-bword,.sd-word,.sd-bword,.fb-read,.sd-read,.fb-mean,.sd-mean,.fb-mean2,.sd-mean2,.fb-ex,.sd-ex')];
    const word = face.querySelector('.fb-word,.fb-bword,.sd-word,.sd-bword');
    const art = face.querySelector('.fb-art');
    els.forEach(e=>{ e.style.fontSize = ''; }); if(art){ art.style.width = ''; art.style.display = ''; }
    if(!word || !face.clientHeight) return;
    const over = () => face.scrollHeight > face.clientHeight + 1 || face.scrollWidth > face.clientWidth + 1;
    if(!over()) return;
    let size = parseFloat(getComputedStyle(word).fontSize), guard = 0;
    /* Cách đọc thu nhỏ cùng tỉ lệ, luôn nhỏ hơn từ chính */
    const rd = face.querySelector('.fb-read,.sd-read');
    const ratio = rd ? Math.min(0.6, parseFloat(getComputedStyle(rd).fontSize) / size) : 0;
    const setSize = v => { word.style.fontSize = v + 'px'; if(rd) rd.style.fontSize = Math.max(12, v*ratio) + 'px'; };
    while(over() && size > 30 && guard++ < 40){ size -= 2; setSize(size); }
    if(over() && art) art.style.width = '110px';
    while(over() && size > 18 && guard++ < 80){ size -= 2; setSize(size); }
    if(over() && art) art.style.display = 'none';
    let k = 1;
    while(over() && k > 0.6 && guard++ < 120){ k -= 0.05;
      els.forEach(e=>{ if(e === word || e === rd) return; e.style.fontSize = ''; const base = parseFloat(getComputedStyle(e).fontSize); e.style.fontSize = Math.max(12, base*k) + 'px'; }); }
  });
}

async function addImpFiles(list){

    if(IMG_LIM.maxInputBytes && f.size > IMG_LIM.maxInputBytes){ err = t('errTooBig'); continue; }
    const url = await new Promise(r=>{ const fr = new FileReader(); fr.onload = ()=>r(fr.result); fr.onerror = ()=>r(''); fr.readAsDataURL(f); });
    if(!IMP) return;
    IMP.files.push({file:f, url});
  }
  renderImport('pick', {err});
}
/* Ảnh dán vào ô (bàn phím Android chèn ảnh trực tiếp) → chuyển thành file */
async function grabPasted(pz){
  const out = [];
  for(const im of [...pz.querySelectorAll('img')]){
    try{
      if(!im.complete) await new Promise(r=>{ im.onload = r; im.onerror = r; });
      const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
      if(!c.width) continue;
      c.getContext('2d').drawImage(im, 0, 0);
      const b = await new Promise(r=>c.toBlob(r, 'image/jpeg', 0.92));
      if(b) out.push(new File([b], 'pasted.jpg', {type:'image/jpeg'}));
    }catch(e){}
  }
  pz.innerHTML = '';
  if(out.length) addImpFiles(out);
}

  fs = fs.filter(f=>/^image\//.test(f.type));

/* Cứu các mục hoàn chỉnh khi câu trả lời bị cắt ngắn (ảnh có quá nhiều từ) */
function salvageItems(text){
  const out = [];
  String(text||'').replace(/\{[^{}]*\}/g, m=>{ try{ const o = JSON.parse(m); if(o && typeof o === 'object') out.push(o); }catch(_){} return m; });
  return out;
}
function addImported(imp, items){
  const s = x => typeof x === 'string' ? x.trim().slice(0,300) : '';
  const have = new Set(S.data.cards.map(c=>String(c.front).trim()));
  const added = []; let skipped = 0;
  (Array.isArray(items) ? items : []).slice(0,80).forEach(it=>{
    if(!it || typeof it !== 'object') return;
    const front = s(it.front).slice(0,80);
    if(!front || (!s(it.meaning) && !s(it.meaningJa) && !s(it.meaningEn))) return;
    if(have.has(front)){ skipped++; return; }
    have.add(front);
    const en = imp.lang==='en';
    const c = {id:uid(), lang: en ? 'en' : 'ja', front, reading: en ? s(it.reading).replace(/^[\/\[]+|[\/\]]+$/g,'') : s(it.reading), meaning:s(it.meaning), meaningJa: en ? '' : s(it.meaningJa), meaningEn: en ? s(it.meaningEn) : '', example:s(it.example), at:Date.now(), from:'image'};
    S.data.cards.push(c); added.push(c);
  });
  if(added.length){ saveData(); renderContent(); }
  imp.added = added.map(c=>c.id);
  renderImport('done', {added, skipped});
}
/* Thu nhỏ ảnh lớn trước khi gửi (ảnh chụp điện thoại thường rất nặng) */
async function prepImage(f){
  try{
    const img = new Image(); img.src = f.url; await img.decode();
    const max = 1800, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    if(sc === 1 && f.file.size < 1500000) return f.file;
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*sc); c.height = Math.round(img.naturalHeight*sc);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    const b = await new Promise(r=>c.toBlob(r, 'image/jpeg', 0.9));
    return b || f.file;
  }catch(e){ return f.file; }
}
async function runImport(){
  if(!IMP || !IMP.files.length) return;
  const imp = IMP;
  imp.ctl = new AbortController();
  renderImport('scan');
  try{
    const images = await Promise.all(imp.files.map(prepImage));
    if(IMP !== imp) return;
    /* Nhận câu trả lời dạng luồng để hiện tiến độ và không bị ngắt khi chờ lâu */
    const onText = ({text})=>{ const n = (String(text).match(/"front"\s*:/g) || []).length; const pr = $('#imp-progress'); if(pr) pr.textContent = n ? t('scanFound', n) : ''; };
    const items = await SAMPLE.json(imp.lang==='en' ? IMPORT_PROMPT_EN : IMPORT_PROMPT, {images, signal: imp.ctl.signal, onText});
    if(IMP !== imp) return;
    addImported(imp, items);
  }catch(e){
    if(IMP !== imp) return;
    const code = (e && e.code) || 'upstream_error';
    if(code === 'cancelled'){ renderImport('pick'); return; }
    if(code === 'invalid_json' || code === 'empty_completion' || ((code === 'upstream_error' || code === 'rate_limited') && e.text)){
      const got = salvageItems(e.text);
      if(got.length){ addImported(imp, got); if(code !== 'invalid_json' && code !== 'empty_completion') toast(t('errPartial')); return; }
      if(code === 'invalid_json' || code === 'empty_completion'){ renderImport('done', {added:[], skipped:0}); return; }
    }
    const k = {not_granted:'errNotGranted', image_rejected:'errImage', images_unavailable:'errImage', rate_limited:'errBusy', queue_overflow:'errBusy',
      upstream_error:'errUpstream', session_expired:'errSession', refused:'errRefused', prompt_too_large:'errTooBig',
      sampling_disabled:'errUnavailable', capability_disabled:'errUnavailable', capability_removed:'errUnavailable', not_declared:'errUnavailable'}[code] || 'errGeneric';
    renderImport('pick', {err: t(k) + ' (' + code + ')'});
  }
}

function makeQ(card, mode){
  const type = mode==='mix' ? (Math.random()<.5 ? 'fm' : 'mf') : mode;
  const key = type==='fm' ? qText : (c=>c.front);
  const right = key(card);
  const lg = x => x.lang || 'ja', same = x => lg(x) === lg(card);
  const cands = [...shuffle(S.quiz.pool.filter(same)), ...shuffle([...S.data.cards, ...PRESETS.flatMap(d=>d.cards)].filter(same))];
  const seen = new Set([right]), opts = [right];
  for(const c of cands){ if(opts.length >= 4) break; const v = key(c); if(v && !seen.has(v)){ seen.add(v); opts.push(v); } }
  return {card, type, right, opts:shuffle(opts), picked:null};
}
function beginQuiz(list){
  const q = S.quiz; q.qs = list.map(c=>makeQ(c, q.mode)); q.i = 0; q.correct = 0; renderQ('next');

}

let XLS = null;
const XLS_MAX = 300;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(loadXLSX.p) return loadXLSX.p;
  loadXLSX.p = new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = 'xlsx.full.min.js';   /* bản app: bộ đọc Excel có sẵn trong app, không cần mạng */
    s.onload = ()=> window.XLSX ? res(window.XLSX) : rej(new Error('no XLSX'));
    s.onerror = ()=>{ loadXLSX.p = null; s.remove(); rej(new Error('load failed')); };
    document.head.appendChild(s);
  });
  return loadXLSX.p;
}
function openXls(){
  openModal(`<div class="sheet xls" id="xls"></div>`, {dismiss:false});
  XLS = {lang: S.fdeck==='@en' ? 'en' : (S.formLang || 'ja'), rows:null, fileName:'', deck:false, deckName:'', cut:0};
  renderXls();
  loadXLSX().catch(()=>{});   /* tải sẵn bộ đọc Excel */
}
function xlsHeaderKey(h){
  const s = norm(h).replace(/[*:()（）\[\]【】]/g,' ').replace(/\s+/g,' ').trim();
  if(!s) return '';
  const has = (...w) => w.some(x=>s.includes(x));
  if(has('ipa','phien am','cach doc','reading','pronun','phonetic','furigana','yomi','読み','よみ','ふりがな','発音')) return 'reading';
  if(has('nhat','japanese','日本語') && has('nghia','meaning','意味','giai thich','説明')) return 'meaningJa';
  if(has('dinh nghia','definition','定義') || (has('anh','english','英語') && has('nghia','meaning','意味'))) return 'meaningEn';
  if(has('nghia','meaning','意味','viet','ベトナム','translation','dich')) return 'meaning';
  if(has('vi du','example','例','sentence','cau mau')) return 'example';
  if(has('ngon ngu','language','lang','言語')) return 'lang';
  if(has('tu','word','front','vocab','term','単語','表面','語彙','kanji','漢字','mat truoc')) return 'front';
  return '';
}
function xlsLangOf(val, front, fallback){
  const v = norm(val);
  if(v){ if(/^(en|eng|anh|tieng anh|english|ielts|英)/.test(v)) return 'en'; if(/^(ja|jp|jpn|nhat|tieng nhat|japanese|bjt|日)/.test(v)) return 'ja'; }
  if(/[\u3040-\u30ff\u3400-\u9fff]/.test(front)) return 'ja';
  if(/^[A-Za-z\u00C0-\u024F0-9\s'’\-.,()&/!?]+$/.test(front)) return 'en';
  return fallback;
}
function parseGrid(grid, fallback){
  const str = v => String(v == null ? '' : v).replace(/\s+/g,' ').trim();
  grid = grid.filter(r=>Array.isArray(r) && r.some(v=>str(v)));
  if(!grid.length) return {rows:[], cut:0};
  let map = {}, start = 0;
  grid[0].forEach((h,i)=>{ const k = xlsHeaderKey(str(h)); if(k && map[k] === undefined) map[k] = i; });
  if(map.front !== undefined && (map.meaning !== undefined || map.meaningJa !== undefined || map.meaningEn !== undefined)) start = 1;
  else map = {front:0, reading:1, meaning:2, example:3, extra:4};
  const rows = [];
  for(const r of grid.slice(start)){
    const g = k => map[k] === undefined ? '' : str(r[map[k]]).slice(0, 300);
    const front = g('front').slice(0, 80); if(!front) continue;
    const lang = xlsLangOf(g('lang'), front, fallback);
    let meaningJa = g('meaningJa'), meaningEn = g('meaningEn');
    if(map.extra !== undefined){ if(lang==='en') meaningEn = g('extra'); else meaningJa = g('extra'); }
    const meaning = g('meaning');
    if(!meaning && !meaningJa && !meaningEn) continue;
    rows.push({lang, front, reading: lang==='en' ? g('reading').replace(/^[\/\[]+|[\/\]]+$/g,'') : g('reading'),
      meaning, meaningJa: lang==='en' ? '' : meaningJa, meaningEn: lang==='en' ? meaningEn : '', example: g('example')});
  }
  const cut = Math.max(0, rows.length - XLS_MAX);
  return {rows: rows.slice(0, XLS_MAX), cut};
}
async function readXls(file){
  if(!XLS) return;
  const st = $('#xls-status'); if(st) st.textContent = t('xlsLoading');
  let X;
  try{ X = await loadXLSX(); }catch(e){ renderXls(t('xlsErrLib')); return; }
  try{
    const buf = await file.arrayBuffer();
    const wb = X.read(buf, {type:'array', codepage:65001});
    let grid = [];
    for(const n of wb.SheetNames){
      const g = X.utils.sheet_to_json(wb.Sheets[n], {header:1, defval:'', raw:false, blankrows:false});
      if(g.some(r=>r.some(v=>String(v).trim()))){ grid = g; break; }
    }
    if(!XLS) return;
    const {rows, cut} = parseGrid(grid, XLS.lang);
    if(!rows.length){ renderXls(t('xlsErrEmpty')); return; }
    XLS.rows = rows; XLS.cut = cut; XLS.fileName = file.name; XLS.deckName = file.name.replace(/\.[^.]+$/,'').slice(0,60);
    renderXls();
  }catch(e){ console.error(e); renderXls(t('xlsErrRead')); }
}

  const dn = $('#xls-dname'); if(dn) dn.oninput = e=>{ XLS.deckName = e.target.value; };

function xlsAdd(){

function beginGame(){

  if(g.rounds.length > 1 && g.rounds[g.rounds.length-1].length < 3) g.rounds[g.rounds.length-2].push(...g.rounds.pop());

function renderGame(dir=''){

        ${g.A.map(x=>`<button class="gm-cell a${cls('a',x.id)}" data-act="gm-a" data-id="${x.id}" ${g.matched.has(x.id)?'disabled':''}><span class="${fc(x.c)}">${esc(x.c.front)}</span></button>`).join('')}
      </div>

        ${g.B.map(x=>`<button class="gm-cell b${cls('b',x.id)}" data-act="gm-b" data-id="${x.id}" ${g.matched.has(x.id)?'disabled':''}><span>${esc(x.text)}</span></button>`).join('')}
      </div>
    </div>` + gmFoot();
}
function gmPick(side, id){
  const g = S.game; if(!g || g.end || g.matched.has(id) || g.bad) return;
  markStudyDay();
  if(side==='a') g.selA = g.selA===id ? null : id; else g.selB = g.selB===id ? null : id;
  g.just = null;
  if(g.selA && g.selB){
    if(g.selA === g.selB){
      g.matched.add(g.selA); g.done++; g.just = g.selA; g.selA = g.selB = null;
      renderGame();
      if(g.matched.size === g.rounds[g.r].length){
        setTimeout(()=>{ if(S.game !== g) return; if(g.r < g.rounds.length-1){ g.r++; gmRound(); } else gmResult(); }, 650);
      }
      return;
    }
    g.mist++; g.bad = {a:g.selA, b:g.selB}; renderGame();
    setTimeout(()=>{ if(S.game !== g) return; g.bad = null; g.selA = g.selB = null; renderGame(); }, 550);

}

/* ===================== Nghe chép chính tả theo câu ví dụ ===================== */
function dcTokens(s, ja){
  if(ja) return [...String(s).replace(/[\s、。，．,.！？!?「」『』（）()・…〜~"'“”‘’:;：；\-ー―]/g,'')];
  return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9'\u00C0-\u024F\s-]/g,' ').replace(/-/g,' ').split(/\s+/).filter(Boolean);
}
function lcsMark(exp, got){
  const n = exp.length, m = got.length;
  const dp = Array.from({length:n+1}, ()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j] = exp[i]===got[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const mark = new Array(n).fill(false); let i = 0, j = 0;
  while(i<n && j<m){ if(exp[i]===got[j]){ mark[i] = true; i++; j++; } else if(dp[i+1][j] >= dp[i][j+1]) i++; else j++; }
  return {mark, ok:dp[0][0]};
}
/* Tô màu đáp án: từ (hoặc ký tự) nghe đúng màu xanh, nghe sót hoặc sai màu đỏ */
function dcAnswerHTML(src, ja, mark){
  let k = 0;
  if(ja) return [...src].map(ch=>{ if(!dcTokens(ch, true).length) return esc(ch); const ok = mark[k++]; return `<span class="${ok?'w-ok':'w-ng'}">${esc(ch)}</span>`; }).join('');
  return src.split(/(\s+)/).map(w=>{ if(/^\s+$/.test(w) || !w) return w; const n = dcTokens(w, false).length; if(!n) return esc(w);
    let ok = true; for(let x=0;x<n;x++){ if(!mark[k++]) ok = false; } return `<span class="${ok?'w-ok':'w-ng'}">${esc(w)}</span>`; }).join('');
}
function dcHintText(src, ja){
  if(ja) return [...src].map(ch=>dcTokens(ch, true).length ? '○' : ch).join('');
  return src.split(/(\s+)/).map(w=>w.replace(/[A-Za-z\u00C0-\u024F0-9]/g, (ch, i)=>i===w.search(/[A-Za-z\u00C0-\u024F0-9]/) ? ch : '_')).join('');
}
