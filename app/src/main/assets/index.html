  const inp = $('#dc-in');

    case 'close-deck': S.deck = null; renderContent(); break;
    case 'add-preset': if(addPreset(id)){ saveData(); renderContent(); toast(t('toastAdded')); } break;
    case 'add-all': { const d = PRESETS.find(x=>x.id===S.deck); let n=0; d.cards.forEach(c=>{ if(addPreset(c.id)) n++; }); saveData(); renderContent(); toast(t('toastAddedN',n)); break; }
    case 'study-mine': startStudy(S.data.cards, ()=>t('tabCards'), {icon:'cards'}); break;
    case 'study-deck': { const d = PRESETS.find(x=>x.id===S.deck); startStudy(d.cards, ()=>L(d.name), {jp:d.jp, icon:d.id}); break; }
    case 'study-any': S.data.cards.length ? startStudy(S.data.cards, ()=>t('tabCards'), {icon:'cards'}) : startStudy(PRESETS[0].cards, ()=>L(PRESETS[0].name), {jp:PRESETS[0].jp, icon:PRESETS[0].id}); break;
    case 'clear-q': S.query=''; $('#q').value=''; renderContent(); break;
    case 'pick': S.sel = id; renderContent(); break;
    case 'dur-minus': setMins(S.mins-5); break;
    case 'dur-plus': setMins(S.mins+5); break;
    case 'start': startTimer(); break;
    case 'giveup': confirmTap(b, t('confirmGiveUp'), giveUp); break;
    case 'import': openImport(); break;
    case 'en-fill': fillEnExamples(); break;
    case 'xls': openXls(); break;
    case 'sel-clear': S.pickSet = new Set(); fcRender(); break;
    case 'sel-del': { const n = S.pickSet.size; if(!n) break;
      confirmTap(b, t('confirmDelN', n), ()=>{
        const gone = S.pickSet;
        S.data.cards = S.data.cards.filter(c=>!gone.has(c.id));
        decksOf().forEach(d=>{ d.cardIds = d.cardIds.filter(x=>!gone.has(x)); });
        S.pickSet = new Set(); S.fi = 0; S.fflip = false;
        saveData(); fcRender(); toast(t('deletedN', n));
      }); break; }
    case 'xls-from-form': closeModal(); openXls(); break;
    case 'xls-lang': if(XLS){ XLS.lang = id; S.formLang = id; renderXls(); } break;
    case 'xls-reset': if(XLS){ XLS.rows = null; XLS.deck = false; renderXls(); } break;
    case 'xls-add': xlsAdd(); break;
    case 'imp-lang': if(IMP){ IMP.lang = id; S.formLang = id; renderImport('pick'); } break;
    case 'imp-scan': runImport(); break;
    case 'imp-stop': if(IMP && IMP.ctl) IMP.ctl.abort(); break;
    case 'imp-rm': if(IMP){ IMP.files.splice(+id,1); renderImport('pick'); } break;
    case 'imp-again': if(IMP){ IMP.files = []; renderImport('pick'); } break;
    case 'imp-undo': if(IMP){ const ids = new Set(IMP.added); S.data.cards = S.data.cards.filter(c=>!ids.has(c.id)); saveData(); closeModal(); renderContent(); toast(t('undone')); } break;
    case 'cv': S.cv = id; S.myDeck = null; renderContent(); break;
    case 'open-mydeck': S.myDeck = id; renderContent(); window.scrollTo({top:0}); break;
    case 'close-mydeck': S.myDeck = null; renderContent(); break;
    case 'deck-new': if(S.data.cards.length) deckForm(); else toast(t('needCardsFirst')); break;
    case 'deck-edit': deckForm(decksOf().find(x=>x.id===id)); break;
    case 'deck-del': confirmTap(b, t('confirmDelDeck'), ()=>{ S.data.decks = decksOf().filter(x=>x.id!==id); S.myDeck = null; saveData(); renderContent(); toast(t('deckDeleted')); }); break;
    case 'deck-study': { const d = decksOf().find(x=>x.id===id); if(d) startStudy(deckCards(d), ()=>d.name, {icon:'layers'}); break; }
    case 'deck-test': { const d = decksOf().find(x=>x.id===id); if(d) startQuiz(deckCards(d), ()=>d.name, (c,n)=>{ d.last = {c, n, at:Date.now()}; saveData(); renderContent(); }, {icon:'layers'}); break; }
    case 'df-all': if(DF){ dfVisible().forEach(c=>DF.sel.add(c.id)); renderDfList(); } break;
    case 'df-none': if(DF){ dfVisible().forEach(c=>DF.sel.delete(c.id)); renderDfList(); } break;
    case 'test-mine': { const l = fcList_(); startQuiz(l.length>=2 ? l : S.data.cards, ()=>t('tabCards'), null, {icon:'cards'}); break; }
    case 'dict-mine': startDict(fcList_(), ()=>t('tabCards'), {icon:'cards'}); break;
    case 'dict-deck': { const d = PRESETS.find(x=>x.id===S.deck); if(d) startDict(d.cards, ()=>L(d.name), {jp:d.jp, icon:d.id}); break; }
    case 'deck-dict': { const d = decksOf().find(x=>x.id===id); if(d) startDict(deckCards(d), ()=>d.name, {icon:'layers'}); break; }
    case 'dc-count': if(S.dict){ S.dict.count = +id; renderDictSetup(); } break;
    case 'dc-start': beginDict(); break;
    case 'dc-play': dcPlay(b, false); break;
    case 'dc-slow': dcPlay(b, true); break;
    case 'dc-hint': if(S.dict){ S.dict.items[S.dict.i].hint = true; renderDictQ(); } break;
    case 'dc-check': dcCheck(); break;
    case 'dc-next': dcNext(); break;
    case 'dc-again': renderDictSetup(); break;
    case 'game-mine': { const l = fcList_(); startGame(l.length>=2 ? l : S.data.cards, ()=>t('tabCards'), {icon:'cards'}); break; }
    case 'game-deck': { const d = PRESETS.find(x=>x.id===S.deck); if(d) startGame(d.cards, ()=>L(d.name), {jp:d.jp, icon:d.id}); break; }
    case 'deck-game': { const d = decksOf().find(x=>x.id===id); if(d) startGame(deckCards(d), ()=>d.name, {icon:'layers'}); break; }
    case 'gm-count': if(S.game){ S.game.count = +id; renderGameSetup(); } break;
    case 'gm-start': beginGame(); break;
    case 'gm-again': renderGameSetup(); break;
    case 'gm-a': gmPick('a', id); break;
    case 'gm-b': gmPick('b', id); break;
    case 'test-deck': { const d = PRESETS.find(x=>x.id===S.deck); if(d) startQuiz(d.cards, ()=>L(d.name), null, {jp:d.jp, icon:d.id}); break; }
    case 'qz-mode': if(S.quiz){ S.quiz.mode = id; renderQuizSetup(); } break;
    case 'qz-count': if(S.quiz){ S.quiz.count = +id; renderQuizSetup(); } break;
    case 'qz-start': if(S.quiz){ S.quiz.retry = false; beginQuiz(shuffle([...S.quiz.pool]).slice(0, S.quiz.count)); } break;
    case 'qz-pick': if(S.quiz){ const Q = S.quiz.qs[S.quiz.i]; if(Q.picked===null){ Q.picked = +id; markStudyDay(); if(Q.opts[Q.picked]===Q.right) S.quiz.correct++; renderQ();
      /* Đọc lại từ vựng ngay sau khi chọn đáp án */
      if(CAN_SPEAK) speakCard(Q.card, document.querySelector('#quiz .qz-speak')); } } break;
    case 'qz-speak': if(S.quiz){ const Q = S.quiz.qs[S.quiz.i]; speakCard(Q.card, b); } break;
    case 'qz-next': if(S.quiz){ if(S.quiz.i >= S.quiz.qs.length-1) renderResult(); else { S.quiz.i++; renderQ(); } } break;
    case 'qz-wrong': if(S.quiz && S.quiz.wrong.length){ S.quiz.retry = true; beginQuiz(shuffle([...S.quiz.wrong])); } break;
    case 'qz-again': if(S.quiz) renderQuizSetup(); break;
    case 'fc-flip': fcFlip(); break;
    case 'fc-prev': fcMove(-1); break;
    case 'fc-next': fcMove(1); break;
    case 'fc-go': S.fi = +id; S.fflip = false; fcRender(true); break;
    case 'fc-known': fcMark(true); break;
    case 'fc-unknown': fcMark(false); break;
    case 'fc-again': S.fi = 0; S.fflip = false; fcRender(true); break;
    case 'fc-speak': fcSpeak(b); break;
    case 'speak-ex': { const c = cardById(id); if(c) speakText(splitExample(c.example).src, isEn(c), b); break; }
    case 'sd-speak': if(S.study) speakCard(S.study.cards[S.study.i], b); break;
    case 'close-modal': closeModal(); break;
    case 'flip': studyFlip(); break;
    case 'next': studyMove(1); break;
    case 'prev': studyMove(-1); break;
    case 'shuffle': { const st=S.study; for(let i=st.cards.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [st.cards[i],st.cards[j]]=[st.cards[j],st.cards[i]]; } st.i=0; st.flip=false; renderStudy(); toast(t('toastShuffled')); break; }
  }
});

/* ===================== Khởi động ===================== */
(async function boot(){
  $('#app').innerHTML = `<div class="splash">${t('loading')}</div>`;
  Store.init();
  const sess = LS.get('session');
  if(sess === GUEST){ await enter(GUEST); return; }
  if(sess){
    const acc = await Store.get('accounts');
    if(acc && acc.users && acc.users[sess]){ await enter(sess); return; }
    LS.set('session', null);
  }
  renderLogin();
})();

</script>
</body>
</html>
